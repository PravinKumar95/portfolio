[package]
name = "portfolio"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
dioxus = { version = "0.6", features = ["web"] }
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"


